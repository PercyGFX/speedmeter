# Builds and publishes a release when you push a version tag.
#
#   1. Bump `version` in Cargo.toml (e.g. 0.2.0) and commit.
#   2. git tag v0.2.0 && git push origin v0.2.0
#
# The workflow tests, builds the installer and attaches it to a GitHub Release.
# Installed copies of SpeedMeter pick it up automatically.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and "v$v" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME doesn't match the Cargo.toml version ($v). Bump the version first."
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer\speedmeter.iss'

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/SpeedMeter-Setup-${{ steps.version.outputs.version }}.exe
          generate_release_notes: true

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedMeter-Setup-${{ steps.version.outputs.version }}
          path: installer/Output/*.exe
